# Blueprint de Render: un solo servicio web gratuito construido con el Dockerfile.
services:
  - type: web
    name: bibliometria-algoritmica
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      # Render gratis no tiene disco persistente: el corpus queda en solo lectura
      - key: SUBIDA_HABILITADA
        value: "false"
